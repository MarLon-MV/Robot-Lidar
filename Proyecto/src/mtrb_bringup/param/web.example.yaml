# Web bridge (FastAPI + rclpy): serves the web UI and the REST/WebSocket API.
# Copy to web.local.yaml to override parameters (git-ignored). It never holds a token.
# The token is read ONLY from (first non-empty wins):
#   1. environment variable MTRB_WEB_TOKEN
#   2. the file auth.token_file (default ~/.config/mtrb/web_token): a REGULAR file (no
#      symlink) owned by the user running the node, mode 0600 (no group/other access).
#      Create it with: install -m 600 /dev/null ~/.config/mtrb/web_token, then write a random
#      token (e.g. `openssl rand -base64 24`) into it. It is read once and never logged.
# The node refuses to start without a token, with a placeholder (CHANGE-ME...), a blank one,
# one made of a single repeated character, or one shorter than 20 characters.
# LAN only: do not expose this port to the internet.
# No TLS here: the token travels in clear text; use an isolated network or a TLS reverse proxy.
mtrb_web_bridge:
  ros__parameters:
    host: 0.0.0.0
    port: 8080
    rates:
      pose: 10.0                # Hz
      scan: 5.0                 # Hz
      status: 1.0               # Hz
      lifecycle: 0.5            # Hz, lifecycle polling for `status.nodes` (0.05 .. 0.5)
    teleop:
      max_vx: 0.2               # m/s     INITIAL: tune on the robot
      max_wz: 0.8               # rad/s   INITIAL: tune on the robot
      timeout_ms: 300           # ms without a teleop message -> zero Twist
      enabled: true             # false -> every teleop message is refused (teleop_disabled)  INITIAL
    scan:
      max_points: 360
      min_range: 0.15           # m
      max_range: 12.0           # m
    plan:
      max_points: 200
    status:
      # Nav2 lifecycle nodes shown in the `status` message. The localization node of the mode
      # (map_server + amcl, or slam_toolbox) is added automatically. Names relative to /r2.
      nodes: [controller_server, planner_server, bt_navigator, behavior_server, velocity_smoother]
    # Directory for POST /api/map/save and GET /api/maps. '' = ~/mtrb_maps (created if missing;
    # if HOME is undefined saving answers 500). Otherwise an absolute path; only [A-Za-z0-9_./-]
    # is accepted (slam_toolbox hands the path to a shell). The name `map` is reserved.
    # Load a saved map with mode:=map map:=<dir>/<name>.yaml
    map_dir: ''
    maps:
      min_free_mb: 200          # MB of free disk required to save a map (507 below this)
      min_interval_s: 5.0       # s between two map saves (429 save_rate_limited)
    limits:
      max_clients: 5
      max_ws_bytes: 4096
      max_connections: 64       # uvicorn limit_concurrency (HTTP + WebSocket), 1 .. 1024
    auth:
      token_file: ~/.config/mtrb/web_token   # PATH of the private token file (not the token)
      allow_example_token: false       # development only: accept the placeholder or a token
                                       # shorter than 20 chars, loopback host only (127.0.0.1,
                                       # ::1, localhost). Never set it to true on the robot.
    dock:                       # overridden by the launch file (dock_x/dock_y/dock_yaw)
      x: 0.0                    # m
      y: 0.0                    # m
      yaw: 0.0                  # rad
